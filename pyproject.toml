[project]
name = "voxkit"
version = "0.0.1"
description = "A python library for building voice agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.11",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]
vad = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
]
smart-turn = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "transformers>=5.18.0",
]
all = [
    "voxkit[vad,smart-turn]",
]

[tool.setuptools.packages.find]
include = ["voxkit*"]  # Only the library; docs output, tests and scripts stay out of the wheel

[dependency-groups]
dev = [
    "langchain-groq>=1.1.3",
    "pre-commit>=4.6.2",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "sounddevice>=0.5.5",
    "python-dotenv>=1.2.2",
    "voxkit[vad,smart-turn]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # Coroutine tests need no decorator
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
faulthandler_timeout = 30  # A hung async test dumps its stack instead of stalling the run

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["site"]

[tool.ruff.lint]
select = [
    "E",    # Style errors (pycodestyle)
    "W",    # Style warnings (pycodestyle)
    "F",    # Unused and undefined names (pyflakes)
    "I",    # Import order (isort)
    "UP",   # Modern syntax (pyupgrade)
    "B",    # Likely bugs (flake8-bugbear)
    "C4",   # Comprehensions (flake8-comprehensions)
    "SIM",  # Simplifications (flake8-simplify)
    "RUF",  # Ruff's own rules
    "D",    # Docstrings (pydocstyle): they are the published API reference
]
ignore = [
    "D107",  # __init__ docstring: mkdocstrings merges init into the class, which documents itself
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Runnable example, not part of the published API surface.
"main.py" = ["D100", "D103"]
# Intentionally-empty stubs (see AGENTS.md) -- nothing to document yet.
"voxkit/exceptions.py" = ["D100"]
"voxkit/vad/base.py" = ["D100"]
"tests/*" = ["D101", "D102", "D103", "D105", "D107"]  # Test doubles need no docstrings

[tool.uv.sources]
voxkit = { workspace = true }
