[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voxchain"
version = "0.2.0"
description = "A python library for building voice agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.11",
    "websockets>=15.0.1",
]

[project.urls]
Homepage = "https://github.com/sachanayush47/voxchain"
Documentation = "https://sachanayush47.github.io/voxchain/"
Repository = "https://github.com/sachanayush47/voxchain"
Issues = "https://github.com/sachanayush47/voxchain/issues"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]
vad = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
]
smart-turn = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "transformers>=5.18.0",
]
noise = [
    "pyrnnoise>=0.4.5",
]
all = [
    "voxchain[vad,smart-turn,noise]",
]

[tool.setuptools.packages.find]
include = ["voxchain*"]  # Only the library. The wheel does not include the docs output, tests or scripts

[dependency-groups]
dev = [
    "langchain-groq>=1.1.3",
    "pre-commit>=4.6.2",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "sounddevice>=0.5.5",
    "python-dotenv>=1.2.2",
    "voxchain[vad,smart-turn,noise]",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # Coroutine tests need no decorator
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
faulthandler_timeout = 30  # A hung async test dumps its stack, so the run does not hang silently

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["site"]

[tool.ruff.lint]
select = [
    "E",    # Style errors (pycodestyle)
    "W",    # Style warnings (pycodestyle)
    "F",    # Unused and undefined names (pyflakes)
    "I",    # Import order (isort)
    "UP",   # Modern syntax (pyupgrade)
    "B",    # Likely bugs (flake8-bugbear)
    "C4",   # Comprehensions (flake8-comprehensions)
    "SIM",  # Simplifications (flake8-simplify)
    "RUF",  # Ruff's own rules
    "D",    # Docstrings (pydocstyle): they are the published API reference
]
ignore = [
    "D107",  # __init__ docstring: mkdocstrings merges __init__ into the class, and the class docstring documents it
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# An example that you can run. It is not part of the published API.
"examples/*" = ["D105", "D107"]
# Stubs that are empty on purpose (see AGENTS.md). They have nothing to document yet.
"voxchain/exceptions.py" = ["D100"]
"voxchain/vad/base.py" = ["D100"]
"tests/*" = ["D101", "D102", "D103", "D105", "D107"]  # Test doubles need no docstrings

[tool.uv.sources]
voxchain = { workspace = true }
