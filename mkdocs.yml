site_name: voxchain
site_description: A thin, event-driven Python library for building real-time voice agents on LangChain/LangGraph.
repo_url: https://github.com/sachanayush47/voxchain
repo_name: sachanayush47/voxchain

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Guides:
      - Cascaded pipeline: guides/cascaded.md
      - Speech-to-speech: guides/speech-to-speech.md
      - Providers: guides/providers.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - API Reference:
      - VoxchainPipeline: reference/pipeline.md
      - RealtimePipeline: reference/realtime.md
      - STT: reference/stt.md
      - TTS: reference/tts.md
      - End-of-turn detection: reference/turn.md
      - Voice activity detection: reference/vad.md
      - Sessions, protocols, audio: reference/shared.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
